<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações do Sistema - MODO ADMIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        {{CSS_CONTENT}}
    </style>
    <div class="content-box">
        <img src="https://riobrancodosul-saude.ids.inf.br/riobrancodosul/painel/idspaiele.dll/cache/idspaiele_dll/res/__9DC5026FCACE651F689369A7.png" alt="Logo" class="logo">
        <h2 class="title">Acesso Administrativo Local</h2>

        <p class="subtitle">Alterações aqui refletirão no Registro do Windows (HKLM) desta máquina.</p>
        
        <div class="field">
            <label>URL Base do Painel (idspaiele.dll)</label>
            <input type="text" id="url" value="{{CURRENT_URL}}">
        </div>

        <div class="field">
            <label>URL da Extensão de Estilo (updates.xml)</label>
            <input type="text" id="extension_url" value="{{CURRENT_EXTENSION_URL}}" placeholder="https://.../updates.xml">
        </div>

        <div class="field">
            <label>ID da Extensão no Chrome (Padrão / Opcional)</label>
            <input type="text" id="extension_id" value="{{CURRENT_EXTENSION_ID}}" placeholder="gclbcjhjbpibjakacaakcgdomkkefmaj">
        </div>

        <button id="btnSalvar">Gravar no Registro</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
        
        <h2 class="title" style="margin-bottom: 5px;">Controle de Hardware</h2>
        <p class="subtitle">Status atual do driver de vídeo: <strong>{{STATUS_DRIVER}}</strong></p>
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btnLigarDriver" style="background: #15803d; width: 50%;">Ativar Monitor</button>
            <button id="btnDesligarDriver" style="background: #334155; width: 50%;">Desativar Monitor</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">
        
        <h2 class="title" style="margin-bottom: 5px;">Atualizações do Sistema</h2>
        <p class="subtitle">Versão instalada: <strong>v{{APP_VERSION}}</strong></p>
        
        <div style="margin-top: 10px;">
            <button id="btnVerificarUpdate" style="background: #0284c7; width: 100%;">Verificar Atualizações</button>
        </div>
        <div id="updateContainer" style="display: none; margin-top: 12px; padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; text-align: center;">
            <p id="updateMsg" style="margin: 0 0 10px 0; font-size: 13px; color: #166534; font-weight: bold;"></p>
            <button id="btnInstalarUpdate" style="background: #15803d; width: 100%; font-size: 13px;">Baixar e Instalar Agora</button>
        </div>
        <div id="updateStatusText" style="display: none; margin-top: 10px; font-size: 13px; text-align: center; color: #64748b;"></div>

    </div>
    
    <script>
        {{JS_CONTENT}}
    </script>
</body>
</html>
